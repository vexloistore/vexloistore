<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Vexloi LLC</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body data-page="contact" class="flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="container-custom py-12 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="space-y-4">
      <div class="hero-tech rounded-2xl p-6 text-white">
        <h1 class="text-2xl font-extrabold">Contact Us</h1>
        <p class="text-sm text-gray-300 mt-2">Quotes, product questions and supplier partnerships. We usually reply within one business day.</p>
      </div>
      <div class="card p-5 space-y-4 text-xs">
        <div class="flex gap-3"><i data-lucide="mail" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Email</b><a id="ci-email" class="hover:underline"></a></div></div>
        <div class="flex gap-3"><i data-lucide="map-pin" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Location</b><span id="ci-loc"></span></div></div>
        <div class="flex gap-3"><i data-lucide="clock" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Hours</b>Mon–Fri, 9:00 AM – 6:00 PM ET</div></div>
        <div class="flex gap-3"><i data-lucide="languages" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Languages</b><span id="ci-lang"></span></div></div>
      </div>
    </div>

    <div class="lg:col-span-2 card p-6 md:p-8">
      <div id="product-ref" class="hidden mb-5 p-3 rounded-xl bg-blue-50 border border-blue-200 flex items-center gap-3"></div>
      <form id="contact-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="label" for="c-company">Company / Name *</label><input id="c-company" type="text" required class="input"></div>
          <div><label class="label" for="c-email">Email *</label><input id="c-email" type="email" required class="input"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="label" for="c-phone">Phone</label><input id="c-phone" type="tel" class="input"></div>
          <div>
            <label class="label" for="c-type">Inquiry Type</label>
            <select id="c-type" class="input">
              <option value="quote">Product quote</option>
              <option value="supplier">Supplier / distribution partnership</option>
              <option value="question">Product question</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div><label class="label" for="c-msg">Message *</label><textarea id="c-msg" rows="8" required class="input" placeholder="Brand, ASIN or UPC, quantities..."></textarea></div>
        <button type="submit" class="btn-primary w-full"><i data-lucide="send" class="w-4 h-4"></i> Send Message</button>
        <p id="form-status" class="text-xs text-center text-gray-400" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const emailLink = document.getElementById('ci-email');
      emailLink.innerText = siteConfig.email;
      emailLink.href = `mailto:${siteConfig.email}`;
      document.getElementById('ci-loc').innerText = siteConfig.location;
      document.getElementById('ci-lang').innerText = siteConfig.languages;
      const msg = document.getElementById('c-msg');
      const type = document.getElementById('c-type');

      const p = productsData.find(x => x.id === params.get('product'));
      if (p) {
        const box = document.getElementById('product-ref');
        box.classList.remove('hidden');
        box.innerHTML = `<img src="${esc(p.image)}" alt="" class="w-12 h-12 object-contain bg-white rounded">
          <div class="text-xs"><b class="text-brand-blue uppercase text-3xs">${esc(p.brand)}</b><p class="font-semibold text-brand-ink line-clamp-1">${esc(p.name)}</p><span class="font-mono text-gray-500">${p.sku}</span></div>`;
        msg.value = `Hello, I would like a quote for:\n${p.brand} — ${p.name}\nASIN: ${p.sku}${p.upc ? ' | UPC: ' + p.upc : ''}\nQuantity: `;
      } else if (params.get('quote')) {
        const list = getCart();
        if (list.length) msg.value = 'Hello, I would like a quote for:\n' +
          list.map(i => `- ${i.qty} x ${i.brand} — ${i.name} (ASIN ${i.sku})`).join('\n') + '\n';
      } else if (params.get('topic') === 'supplier') {
        type.value = 'supplier';
        const pr = getProfile(params.get('profile'));
        if (pr) msg.value = `Hello Vexloi team,\n\nWe distribute products in ${pr.name} and would like to talk about supplying your store.\n\nBrands we carry: \n`;
      }

      const form = document.getElementById('contact-form');
      const status = document.getElementById('form-status');
      const btn = form.querySelector('button[type=submit]');
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const company = document.getElementById('c-company').value.trim();
        const from = document.getElementById('c-email').value.trim();
        const phone = document.getElementById('c-phone').value.trim();
        const label = type.options[type.selectedIndex].text;
        const subject = `${label} — ${company}`;
        const mailto = () => { location.href = `mailto:${siteConfig.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg.value + '\n\n---\n' + company + '\n' + from + (phone ? '\n' + phone : ''))}`; };
        if (!siteConfig.formEndpoint) return mailto();
        btn.disabled = true; btn.style.opacity = .6;
        status.className = 'text-xs text-center text-gray-500'; status.innerText = 'Sending...';
        try {
          const r = await fetch(siteConfig.formEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ _subject: subject, _replyto: from, _template: 'table', _captcha: 'false',
              'Inquiry type': label, 'Name / Company': company, Email: from, Phone: phone, Message: msg.value, Page: location.href }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok || String(data.success) === 'false') throw new Error(data.message || r.status);
          form.reset();
          status.className = 'text-sm text-center font-semibold text-green-700';
          status.innerText = 'Thank you! Your message was sent. We will reply within one business day.';
          if (params.get('quote')) clearCart();
        } catch (err) {
          status.className = 'text-xs text-center text-red-600';
          status.innerHTML = `We could not send your message. Please email us at <a class="underline" href="mailto:${esc(siteConfig.email)}">${esc(siteConfig.email)}</a>.`;
        } finally {
          btn.disabled = false; btn.style.opacity = 1;
        }
      });
    });
  </script>
</body>
</html>
