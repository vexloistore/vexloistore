<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Wholesale Quotes | Vexloi LLC</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="contact" class="flex flex-col min-h-screen">
  <div id="site-header"></div>

  <main class="container-custom py-12 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="space-y-4">
      <div class="hero-tech rounded-2xl p-6 text-white">
        <h1 class="text-2xl font-extrabold">Wholesale Inquiries</h1>
        <p class="text-sm text-gray-300 mt-2">Volume pricing, MOQs, availability and export logistics. We usually reply within one business day.</p>
      </div>
      <div class="card p-5 space-y-4 text-xs">
        <div class="flex gap-3"><i data-lucide="mail" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Email</b>sales@vexloi.com</div></div>
        <div class="flex gap-3"><i data-lucide="map-pin" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Location</b>Doral / Miami, Florida, USA</div></div>
        <div class="flex gap-3"><i data-lucide="clock" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Hours</b>Mon–Fri, 9:00 AM – 6:00 PM ET</div></div>
        <div class="flex gap-3"><i data-lucide="languages" class="w-5 h-5 text-brand-blue"></i><div><b class="block text-brand-ink">Languages</b>English · Español</div></div>
      </div>
    </div>

    <div class="lg:col-span-2 card p-6 md:p-8">
      <div id="product-ref" class="hidden mb-5 p-3 rounded-xl bg-blue-50 border border-blue-200 flex items-center gap-3"></div>
      <form class="space-y-4" onsubmit="event.preventDefault(); alert('Thank you! Your inquiry was sent. Our sales team will contact you shortly.'); this.reset();">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="label" for="c-company">Company / Name *</label><input id="c-company" type="text" required class="input"></div>
          <div><label class="label" for="c-email">Email *</label><input id="c-email" type="email" required class="input"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="label" for="c-country">Country</label><input id="c-country" type="text" placeholder="USA, Colombia, Mexico..." class="input"></div>
          <div>
            <label class="label" for="c-type">Inquiry Type</label>
            <select id="c-type" class="input">
              <option>Volume pricing / Quote</option>
              <option>Open a B2B account</option>
              <option>Export & logistics</option>
              <option>Brand / distribution partnership</option>
              <option>Other</option>
            </select>
          </div>
        </div>
        <div><label class="label" for="c-msg">Message / SKU list *</label><textarea id="c-msg" rows="6" required class="input" placeholder="Brand, ASIN or UPC, quantities..."></textarea></div>
        <button type="submit" class="btn-primary w-full"><i data-lucide="send" class="w-4 h-4"></i> Send Inquiry</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="products.js?v=20261007"></script>
  <script src="script.js?v=20261007"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const p = productsData.find(x => x.id === new URLSearchParams(location.search).get('product'));
      if (!p) return;
      const box = document.getElementById('product-ref');
      box.classList.remove('hidden');
      box.innerHTML = `<img src="${esc(p.image)}" alt="" class="w-12 h-12 object-contain bg-white rounded">
        <div class="text-xs"><b class="text-brand-blue uppercase text-3xs">${esc(p.brand)}</b><p class="font-semibold text-brand-ink line-clamp-1">${esc(p.name)}</p><span class="font-mono text-gray-500">${p.sku}</span></div>`;
      document.getElementById('c-msg').value = `Hello, we would like volume pricing for:\n${p.brand} — ${p.name}\nASIN: ${p.sku}${p.upc ? ' | UPC: ' + p.upc : ''}\nQuantity: `;
    });
  </script>
</body>
</html>
