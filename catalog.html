<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wholesale Catalog | Vexloi LLC</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="catalog" class="flex flex-col min-h-screen">
  <div id="site-header"></div>

  <!-- CATEGORY BANNER -->
  <section class="hero-tech text-white">
    <div class="container-custom py-8">
      <nav id="breadcrumb" class="text-2xs text-gray-400 mb-2"></nav>
      <div class="flex items-center gap-4">
        <span id="banner-icon" class="w-12 h-12 rounded-xl bg-brand-blue flex items-center justify-center shrink-0"></span>
        <div>
          <h1 id="banner-title" class="text-2xl md:text-3xl font-extrabold">Full Catalog</h1>
          <p id="banner-desc" class="text-sm text-gray-300 mt-0.5"></p>
        </div>
      </div>
    </div>
  </section>

  <main class="container-custom py-8 flex-1 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- SIDEBAR -->
      <aside class="lg:col-span-3 space-y-4">
        <div class="card p-4">
          <label class="label" for="search-input">Search</label>
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
            <input id="search-input" type="search" placeholder="Product, brand, ASIN, UPC..." class="input" style="padding-left:2.2rem">
          </div>
        </div>

        <div class="card p-4">
          <label class="label" for="cat-select-mobile">Categories</label>
          <select id="cat-select-mobile" class="input lg:hidden"></select>
          <div id="cat-list" class="space-y-0.5 hidden lg:block"></div>
        </div>

        <div id="sub-box" class="card p-4 hidden">
          <h3 class="label">Subcategory</h3>
          <div id="sub-list" class="space-y-0.5 max-h-72 overflow-y-auto scrollbar-thin pr-1"></div>
        </div>

        <div class="card p-4">
          <label class="label" for="brand-select">Brand</label>
          <select id="brand-select" class="input"></select>
        </div>
      </aside>

      <!-- RESULTS -->
      <section class="lg:col-span-9">
        <div class="card p-3 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <span id="result-count" class="text-xs font-semibold text-brand-ink">Loading products...</span>
            <div id="active-chips" class="flex flex-wrap gap-2"></div>
          </div>
          <div class="flex items-center gap-2">
            <label for="sort-select" class="text-2xs font-semibold text-gray-500 uppercase whitespace-nowrap">Sort by</label>
            <select id="sort-select" class="input" style="width:auto">
              <option value="popular">Best Selling</option>
              <option value="brand">Brand A–Z</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </div>
        </div>

        <div id="catalog-products-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4"></div>
        <div id="pagination" class="flex flex-wrap justify-center gap-1.5 mt-8"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    const PAGE_SIZE = 36;
    const params = new URLSearchParams(location.search);
    const state = {
      cat: getCategoryIdBySlug(params.get('cat')),
      sub: params.get('sub') || '',
      brand: Number(params.get('brand')) || null,
      q: params.get('q') || '',
      sort: params.get('sort') || 'popular',
      page: Math.max(1, Number(params.get('page')) || 1),
    };
    // Si llega solo la marca, se ubica su categoría
    if (state.brand && !state.cat && brandsDict[state.brand]) state.cat = brandsDict[state.brand].categoryId;

    function syncUrl() {
      const p = new URLSearchParams();
      if (state.cat) p.set('cat', getCategory(state.cat).slug);
      if (state.sub) p.set('sub', state.sub);
      if (state.brand) p.set('brand', state.brand);
      if (state.q) p.set('q', state.q);
      if (state.sort !== 'popular') p.set('sort', state.sort);
      if (state.page > 1) p.set('page', state.page);
      history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
    }

    function setState(patch, resetPage = true) {
      Object.assign(state, patch);
      if (resetPage) state.page = 1;
      render();
    }

    function matchesSearch(p, term) {
      return term.split(/\s+/).every(t =>
        p.desc.toLowerCase().includes(t) || p.brand.toLowerCase().includes(t) ||
        p.sku.toLowerCase().includes(t) || p.upc.includes(t) || p.subcategory.toLowerCase().includes(t));
    }

    function render() {
      const term = state.q.trim().toLowerCase();
      const bySearch = term ? productsData.filter(p => matchesSearch(p, term)) : productsData;

      // Sidebar de categorías (conteos según búsqueda)
      const catCounts = countBy(bySearch, p => p.categoryId);
      document.getElementById('cat-list').innerHTML =
        `<button class="filter-link ${!state.cat ? 'active' : ''}" onclick="setState({cat:null, sub:'', brand:null})"><span>All Categories</span><span class="count">${bySearch.length}</span></button>` +
        Object.entries(categoriesDict).map(([id, c]) => `
          <button class="filter-link ${state.cat === Number(id) ? 'active' : ''}" onclick="setState({cat:${id}, sub:'', brand:null})">
            <span class="flex items-center gap-2"><i data-lucide="${c.icon}" class="w-3.5 h-3.5"></i>${esc(c.name)}</span><span class="count">${catCounts[id] || 0}</span>
          </button>`).join('');

      document.getElementById('cat-select-mobile').innerHTML =
        `<option value="">All Categories (${bySearch.length})</option>` +
        Object.entries(categoriesDict).map(([id, c]) => `<option value="${id}" ${state.cat === Number(id) ? 'selected' : ''}>${esc(c.name)} (${catCounts[id] || 0})</option>`).join('');

      const inCat = state.cat ? bySearch.filter(p => p.categoryId === state.cat) : bySearch;

      // Subcategorías
      const subBox = document.getElementById('sub-box');
      if (state.cat) {
        const base = state.brand ? inCat.filter(p => p.brandId === state.brand) : inCat;
        const subs = Object.entries(countBy(base, p => p.subcategory || 'Other')).sort((a, b) => b[1] - a[1]);
        subBox.classList.remove('hidden');
        document.getElementById('sub-list').innerHTML =
          `<button class="filter-link ${!state.sub ? 'active' : ''}" onclick="setState({sub:''})"><span>All</span><span class="count">${base.length}</span></button>` +
          subs.map(([s, n]) => `<button class="filter-link ${state.sub === s ? 'active' : ''}" data-sub="${esc(s)}" onclick="setState({sub:this.dataset.sub})"><span class="line-clamp-1">${esc(s)}</span><span class="count">${n}</span></button>`).join('');
      } else {
        subBox.classList.add('hidden');
      }

      // Marcas disponibles (según categoría/subcategoría)
      const forBrands = state.sub ? inCat.filter(p => (p.subcategory || 'Other') === state.sub) : inCat;
      const brandCounts = countBy(forBrands, p => p.brandId);
      const brandIds = Object.keys(brandCounts).map(Number).sort((a, b) => brandsDict[a].name.localeCompare(brandsDict[b].name));
      if (state.brand && !brandCounts[state.brand]) brandIds.unshift(state.brand);
      document.getElementById('brand-select').innerHTML = `<option value="">All Brands (${brandIds.length})</option>` +
        brandIds.map(id => `<option value="${id}" ${state.brand === id ? 'selected' : ''}>${esc(brandsDict[id].name)} (${brandCounts[id] || 0})</option>`).join('');

      // Resultados
      let list = forBrands;
      if (state.brand) list = list.filter(p => p.brandId === state.brand);
      const sorters = {
        popular: (a, b) => a.pop - b.pop,
        brand: (a, b) => a.brand.localeCompare(b.brand) || a.rank - b.rank,
        'price-asc': (a, b) => a.price - b.price,
        'price-desc': (a, b) => b.price - a.price,
        rating: (a, b) => b.rating - a.rating || b.reviews - a.reviews,
      };
      list = [...list].sort(sorters[state.sort] || sorters.popular);

      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      state.page = Math.min(state.page, pages);
      const start = (state.page - 1) * PAGE_SIZE;
      const pageItems = list.slice(start, start + PAGE_SIZE);

      document.getElementById('result-count').innerText = list.length
        ? `Showing ${start + 1}–${start + pageItems.length} of ${list.length.toLocaleString('en-US')} products`
        : 'No products found';

      const grid = document.getElementById('catalog-products-grid');
      grid.innerHTML = pageItems.length ? pageItems.map(createProductCardHTML).join('') : `
        <div class="col-span-full card p-12 text-center">
          <i data-lucide="search-x" class="w-10 h-10 mx-auto text-gray-300 mb-3"></i>
          <p class="text-sm font-semibold text-gray-600">No products match your filters.</p>
          <button onclick="setState({cat:null, sub:'', brand:null, q:''}); document.getElementById('search-input').value='';" class="btn-ghost mt-4">Clear all filters</button>
        </div>`;

      renderPagination(pages);
      renderChips();
      renderBanner();
      document.getElementById('sort-select').value = state.sort;
      syncUrl();
      if (window.lucide) lucide.createIcons();
    }

    function renderPagination(pages) {
      const el = document.getElementById('pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }
      const nums = [...new Set([1, state.page - 2, state.page - 1, state.page, state.page + 1, state.page + 2, pages])]
        .filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
      let html = `<button class="tab-btn" ${state.page === 1 ? 'disabled style="opacity:.4"' : ''} onclick="goPage(${state.page - 1})">&larr;</button>`;
      nums.forEach((n, i) => {
        if (i && n - nums[i - 1] > 1) html += `<span class="px-1 text-gray-400">…</span>`;
        html += `<button class="tab-btn ${n === state.page ? 'active' : ''}" onclick="goPage(${n})">${n}</button>`;
      });
      html += `<button class="tab-btn" ${state.page === pages ? 'disabled style="opacity:.4"' : ''} onclick="goPage(${state.page + 1})">&rarr;</button>`;
      el.innerHTML = html;
    }

    function goPage(n) {
      setState({ page: n }, false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderChips() {
      const chips = [];
      if (state.q) chips.push(['q', `“${state.q}”`]);
      if (state.sub) chips.push(['sub', state.sub]);
      if (state.brand) chips.push(['brand', brandsDict[state.brand].name]);
      document.getElementById('active-chips').innerHTML = chips.map(([k, label]) =>
        `<button onclick="clearFilter('${k}')" class="badge badge-blue" style="text-transform:none">${esc(label)} <i data-lucide="x" class="w-3 h-3"></i></button>`).join('');
    }

    function clearFilter(k) {
      if (k === 'q') document.getElementById('search-input').value = '';
      setState({ [k]: k === 'brand' ? null : '' });
    }

    function renderBanner() {
      const c = state.cat ? getCategory(state.cat) : null;
      const brand = state.brand ? brandsDict[state.brand].name : '';
      document.getElementById('banner-title').innerText = brand ? `${brand}` : (c ? c.name : 'Full Wholesale Catalog');
      document.getElementById('banner-desc').innerText = brand
        ? `Top ${productsData.filter(p => p.brandId === state.brand).length} best-selling ${brand} products${c ? ' · ' + c.name : ''}`
        : (c ? c.desc : `The top 10 best-selling products of ${Object.keys(brandsDict).length} brands across ${Object.keys(categoriesDict).length} technology categories.`);
      document.getElementById('banner-icon').innerHTML = `<i data-lucide="${c ? c.icon : 'layout-grid'}" class="w-6 h-6"></i>`;
      document.getElementById('breadcrumb').innerHTML = `<a href="index.html" class="hover:text-white">Home</a> / <a href="catalog.html" class="hover:text-white">Catalog</a>` +
        (c ? ` / <a href="catalog.html?cat=${c.slug}" class="hover:text-white">${esc(c.name)}</a>` : '') + (brand ? ` / ${esc(brand)}` : '');
      document.title = `${brand || (c ? c.name : 'Wholesale Catalog')} | Vexloi LLC`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const search = document.getElementById('search-input');
      search.value = state.q;
      let t;
      search.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => setState({ q: search.value }), 200); });
      document.getElementById('brand-select').addEventListener('change', e => {
        const id = Number(e.target.value) || null;
        setState({ brand: id, sub: '', cat: id ? brandsDict[id].categoryId : state.cat });
      });
      document.getElementById('cat-select-mobile').addEventListener('change', e => setState({ cat: Number(e.target.value) || null, sub: '', brand: null }));
      document.getElementById('sort-select').addEventListener('change', e => setState({ sort: e.target.value }));
      document.querySelectorAll('#site-header input[name=q]').forEach(i => i.value = state.q);
      render();
    });
  </script>
</body>
</html>
