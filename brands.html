<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Brands | Vexloi LLC</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-page="brands" class="flex flex-col min-h-screen">
  <div id="site-header"></div>

  <section class="hero-tech text-white">
    <div class="container-custom py-10">
      <span class="text-2xs font-bold text-brand-cyan uppercase tracking-widest-2">Featured Brands</span>
      <h1 class="text-3xl md:text-4xl font-extrabold mt-1">Shop by Brand</h1>
      <p id="brands-intro" class="text-sm text-gray-300 mt-2 max-w-2xl"></p>
      <div class="mt-5 max-w-md relative">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-3"></i>
        <input id="brand-filter" type="search" placeholder="Filter brands..." class="input" style="padding-left:2.2rem">
      </div>
    </div>
  </section>

  <main class="container-custom py-10 flex-1 w-full space-y-10" id="brands-container"></main>

  <div id="site-footer"></div>

  <script src="products.js?v=20261007"></script>
  <script src="script.js?v=20261007"></script>
  <script>
    function renderBrands(term = '') {
      const t = term.trim().toLowerCase();
      const counts = countBy(productsData, p => p.brandId);
      const html = Object.entries(categoriesDict).map(([cid, c]) => {
        const ids = Object.keys(brandsDict).map(Number)
          .filter(id => brandsDict[id].categoryId === Number(cid) && brandsDict[id].name.toLowerCase().includes(t))
          .sort((a, b) => brandsDict[a].name.localeCompare(brandsDict[b].name));
        if (!ids.length) return '';
        return `
          <section>
            <div class="flex items-center gap-3 mb-4">
              <span class="w-9 h-9 rounded-lg bg-blue-50 text-brand-blue flex items-center justify-center"><i data-lucide="${c.icon}" class="w-4 h-4"></i></span>
              <h2 class="text-lg font-extrabold text-brand-ink">${esc(c.name)}</h2>
              <span class="text-2xs text-gray-400">${ids.length} brands</span>
              <a href="catalog.html?cat=${c.slug}" class="ml-auto text-xs font-semibold text-brand-blue hover:underline">View category &rarr;</a>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
              ${ids.map(id => `
                <a href="catalog.html?brand=${id}" class="card card-hover px-3 py-4 text-center">
                  <span class="block text-sm font-extrabold text-brand-ink uppercase line-clamp-1">${esc(brandsDict[id].name)}</span>
                  <span class="text-3xs text-gray-400">${counts[id]} top products</span>
                </a>`).join('')}
            </div>
          </section>`;
      }).join('');
      document.getElementById('brands-container').innerHTML = html || '<p class="text-center text-sm text-gray-500">No brands match your search.</p>';
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('brands-intro').innerText =
        `${Object.keys(brandsDict).length} brands organized in ${Object.keys(categoriesDict).length} categories. Each brand page shows its 10 best-selling products.`;
      document.getElementById('brand-filter').addEventListener('input', e => renderBrands(e.target.value));
      renderBrands();
    });
  </script>
</body>
</html>
