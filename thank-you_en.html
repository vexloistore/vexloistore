<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Vexloi LLC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#060b13',
                        cyberCard: '#0d1527',
                        cyberBlue: '#00d2ff',
                        cyberNeon: '#05ffc5',
                    },
                    boxShadow: {
                        'neon-blue': '0 0 15px rgba(0, 210, 255, 0.3)',
                        'neon-green': '0 0 15px rgba(5, 255, 197, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(13, 21, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.15);
        }
    </style>
</head>
<body class="bg-cyberDark text-gray-200 font-sans selection:bg-cyberBlue selection:text-black">

    <!-- HEADER -->
    <header class="fixed top-0 w-full z-50 glass-panel border-b border-cyberBlue/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black tracking-widest text-white">VEXLOI<span class="text-cyberBlue">.</span>LLC</span>
            </div>
            <nav class="hidden md:flex space-x-8 text-sm font-medium tracking-wide text-gray-400">
                <a href="index.html#home" class="hover:text-cyberBlue transition-colors">Home</a>
                <a href="index.html#supply" class="hover:text-cyberBlue transition-colors">Supply</a>
                <a href="index.html#logistics" class="hover:text-cyberBlue transition-colors">Logistics Hub</a>
                <a href="index.html#contact" class="hover:text-cyberBlue transition-colors">Contact</a>
            </nav>
        </div>
    </header>

    <main class="min-h-screen flex items-center justify-center text-center px-6 pt-20">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white leading-tight">
                Request Sent
                <span class="block text-transparent bg-clip-text bg-gradient-to-r from-cyberBlue to-cyberNeon">
                    Successfully
                </span>
            </h1>
            <p class="mt-6 text-base md:text-lg text-gray-400 max-w-2xl mx-auto leading-relaxed">
                We have received your message. Our team of specialists will contact you shortly to address your B2B requirement.
            </p>
            <a href="index.html" class="mt-10 inline-block px-8 py-4 bg-cyberBlue text-black font-bold text-sm tracking-wide uppercase rounded-sm hover:bg-white transition-all duration-300 shadow-neon-blue">
                Back to Home
            </a>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-gray-950 py-12 bg-cyberDark font-mono text-xs text-gray-500">
        <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span>© 2026 Vexloi LLC. Miami, Florida.</span>
            </div>
            <div class="flex space-x-6">
                <span class="text-gray-600">// SUPPLY LOGISTICS HUB</span>
                <span>B2B & Export</span>
            </div>
        </div>
    </footer>

</body>
</html>
