<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030712;
            font-family: 'Inter', sans-serif;
            background-image: url('https://i.imgur.com/6a2e83h.jpg');

            background-position: center;
            background-attachment: fixed;

<body class="flex items-center justify-center min-h-screen text-center px-6 text-white bg-slate-900/50" style="background: radial-gradient(circle, rgba(3,7,18,0.6) 0%, rgba(3,7,18,1) 70%);">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-5xl md:text-7xl font-black mb-6">Request <span class="text-cyan-400">Received!</span></h1>
        <p class="text-xl text-gray-300 mb-10 max-w-2xl mx-auto leading-relaxed">

        <a href="index.html" class="neon-button inline-block px-10 py-4 rounded-md font-bold text-white uppercase tracking-widest hover:shadow-lg">
